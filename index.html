<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenCanvas Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Pantalla de login (solo si no hay sesión) -->
  <div id="login" class="login">
    <div class="login-card">
      <h1><span class="logo">◐</span> OpenCanvas <span>Studio</span></h1>
      <p class="muted">Conecta tu repositorio de GitHub Pages para editar visualmente.</p>
      <label>Usuario / organización <input id="inp-owner" placeholder="tu-usuario" /></label>
      <label>Repositorio <input id="inp-repo" placeholder="mi-sitio" /></label>
      <label>Rama <input id="inp-branch" value="main" /></label>
      <label>Personal Access Token <input id="inp-token" type="password" placeholder="ghp_..." /></label>
      <button id="btn-connect" class="btn primary">Conectar</button>
      <p id="login-msg" class="msg"></p>
    </div>
  </div>

  <!-- Editor a pantalla completa -->
  <div id="editor" class="editor" hidden>
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="brand-mini">◐ OpenCanvas</span>
        <select id="file-select" class="file-select"></select>
      </div>
      <div class="toolbar-right">
        <button id="btn-select" class="btn tool active" title="Seleccionar y mover">✥ Mover</button>
        <button id="btn-text" class="btn tool" title="Editar texto">✎ Texto</button>
        <button id="btn-undo" class="btn" title="Deshacer cambios locales">↶</button>
        <button id="btn-reload" class="btn" title="Recargar archivo">↻</button>
        <button id="btn-save" class="btn primary">Guardar</button>
        <button id="btn-logout" class="btn ghost">Salir</button>
      </div>
    </div>

    <iframe id="preview" class="preview"></iframe>

    <div id="props" class="props" hidden>
      <div class="props-header">
        <span id="props-title">Elemento</span>
        <button id="props-close" class="btn ghost small">✕</button>
      </div>
      <div class="props-body">
        <label>Texto
          <textarea id="prop-text" rows="3"></textarea>
        </label>
        <div class="grid-2">
          <label>X <input id="prop-x" type="number" /></label>
          <label>Y <input id="prop-y" type="number" /></label>
        </div>
        <div class="grid-2">
          <label>Ancho <input id="prop-w" type="number" /></label>
          <label>Alto <input id="prop-h" type="number" /></label>
        </div>
        <label>Color de fondo <input id="prop-bg" type="color" /></label>
        <label>Color de texto <input id="prop-color" type="color" /></label>
        <button id="prop-delete" class="btn danger">Eliminar elemento</button>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
